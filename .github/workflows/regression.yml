name: regression

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3
      - run: dotnet build Wasm2Cs.slnx -m:1 -p:UseSharedCompilation=false --nologo
      - run: dotnet tests/Wasm2Cs.Tests/bin/Debug/net10.0/Wasm2Cs.Tests.dll
      - run: dotnet samples/Smoke/bin/Debug/net10.0/Smoke.dll
      - run: node scripts/measure-rust-std.mjs
      - run: node scripts/test-build.mjs
      - run: node scripts/pack.mjs
      - run: node scripts/test-package.mjs
      - run: node scripts/test-self-hosting-verify.mjs
