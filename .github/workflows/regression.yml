name: regression

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3
      - run: dotnet build Wasm2Cs.slnx -m:1 -p:UseSharedCompilation=false --nologo
      - run: dotnet tests/Wasm2Cs.Tests/bin/Debug/net10.0/Wasm2Cs.Tests.dll
      - run: dotnet samples/Smoke/bin/Debug/net10.0/Smoke.dll
      - run: node scripts/measure-rust-std.mjs
      - run: node scripts/test-build.mjs
      - run: node scripts/pack.mjs
      - run: node scripts/test-package.mjs
      - run: node scripts/test-self-hosting-verify.mjs
