name: self-hosting

# Dispatch only. A green regression check is not this job, and an unrun
# dispatch is not a success. Unity IL2CPP stays on a licensed Windows machine.
# A green run requires the runner rebuild to match the canonical bundle.
on:
  workflow_dispatch:

jobs:
  self-hosting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.400
      - name: select pinned SDK
        run: printf '%s\n' '{"sdk":{"version":"10.0.400","rollForward":"disable"}}' > global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
      - name: install pinned WABT
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wabt.tar.gz https://github.com/WebAssembly/wabt/releases/download/1.0.41/wabt-1.0.41-linux-x64.tar.gz
          echo "83f8122e924745fcd70636e3594bc01c4c47f2d4c8f3c63b5d70d3f83a482677  /tmp/wabt.tar.gz" | sha256sum -c -
          mkdir -p /tmp/wabt
          tar -C /tmp/wabt -xzf /tmp/wabt.tar.gz
          bin=$(find /tmp/wabt -type d -name bin -print -quit)
          test -n "$bin"
          echo "$bin" >> "$GITHUB_PATH"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/wasm2cs-self-hosting-environment
          key: wasm2cs-self-hosting-bbc6f433d63c2dbd780c19f6b7e7f453505f270f506ca3ba8b889c53a00b7838
      - run: node scripts/self-hosting.mjs prepare
      - run: node scripts/self-hosting.mjs reference
      - run: node scripts/self-hosting.mjs verify
